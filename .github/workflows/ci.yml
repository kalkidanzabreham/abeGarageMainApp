name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: codeBase/abeGarage

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codeBase/abeGarage/*/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - name: Backend (fails on any problem)
        run: npm --prefix backend run lint
      - name: Frontend (fails on new problems only, see frontend/eslint-baseline.json)
        run: npm --prefix frontend run lint:ci

  backend:
    name: Backend tests (Jest + Supertest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: root
      DB_NAME: garagehub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codeBase/abeGarage/backend/package-lock.json
      - run: npm ci --prefix backend
      - name: Create an empty database
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE garagehub"
      - name: Migrate a clean database
        run: npm --prefix backend run migrate
      - name: Seed demo data
        run: npm --prefix backend run seed
      - name: Tests with coverage (own database garagehub_test, see tests/globalSetup.js)
        run: npm --prefix backend run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./backend/coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Backend coverage", "| | % | covered |", "|---|---|---|",
              ...["statements","branches","functions","lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: codeBase/abeGarage/backend/coverage/

  e2e:
    name: Browser regression tests (Playwright, production build)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      PORT: "5000"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: root
      DB_NAME: garagehub
      CORS_ORIGINS: http://localhost:4173
      # the e2e global setup re-seeds before the run
      SEED_ALLOW_PRODUCTION: "true"
      DEMO_PASSWORD: GarageHub-demo-1
      VITE_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codeBase/abeGarage/*/package-lock.json
      - name: Generate a throwaway JWT secret for this run
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e
      - name: Create and migrate the database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE garagehub"
          npm --prefix backend run migrate
      - name: Production build of the frontend
        run: npm --prefix frontend run build
      - name: Install Chromium
        working-directory: codeBase/abeGarage/e2e
        run: npx playwright install --with-deps chromium
      - name: Playwright tests (starts the API and vite preview)
        working-directory: codeBase/abeGarage/e2e
        env:
          CI: "true"
          # only here: npm ci must not run with NODE_ENV=production, or it
          # skips devDependencies (vite, @playwright/test)
          NODE_ENV: production
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            codeBase/abeGarage/e2e/playwright-report/
            codeBase/abeGarage/e2e/test-results/
