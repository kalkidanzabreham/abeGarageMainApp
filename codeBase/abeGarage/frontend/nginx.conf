# Static SPA + reverse proxy to the API, so the browser uses one origin.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # hashed build assets never change: cache them for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # the API (service name "api" in docker-compose)
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # client-side routes (/admin/orders, ...) all serve index.html
  location / {
    try_files $uri /index.html;
  }
}
